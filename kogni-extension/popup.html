<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kogni</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 240px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #ffffff;
      padding: 16px;
    }
    h1 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    p  { font-size: 12px; color: #666; margin-bottom: 12px; line-height: 1.5; }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 500;
      margin-bottom: 12px;
    }
    .badge.active   { background: #E1F5EE; color: #085041; }
    .badge.inactive { background: #F1EFE8; color: #444; }
    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-top: 1px solid #f0f0f0;
      font-size: 12px;
    }
    .score-val { font-weight: 600; font-size: 14px; }
    a {
      display: block;
      text-align: center;
      font-size: 12px;
      color: #0f6e56;
      text-decoration: none;
      margin-top: 12px;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Kogni</h1>
  <p>Passive cognitive health tracking</p>

  <span id="status-badge" class="badge inactive">Not connected</span>

  <div id="score-section" style="display:none">
    <div class="score-row">
      <span>Fatigue score</span>
      <span class="score-val" id="score-val">—</span>
    </div>
    <div class="score-row">
      <span>Status</span>
      <span id="score-label">—</span>
    </div>
  </div>

  <a href="http://localhost:3000" target="_blank">Open dashboard ↗</a>

  <script src="src/popup.js"></script>
</body>
</html>
